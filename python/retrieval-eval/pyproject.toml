[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "retrieval-eval"
version = "0.1.0"
description = "Your RAG test suite decays every time you re-chunk. Drift detection that tells you which relevance labels are still true after a chunker or corpus change and re-anchors the ones it can, plus deterministic retrieval metrics and a portable, TREC qrels-compatible judgment format."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "retrieval-eval contributors" }]
keywords = [
  "rag",
  "drift",
  "label-drift",
  "chunking",
  "retrieval",
  "evaluation",
  "rag-evaluation",
  "ndcg",
  "recall",
  "precision",
  "mrr",
  "map",
  "qrels",
  "trec",
  "information-retrieval",
  "golden-dataset",
  "regression-testing",
  "llm",
  "vector-search",
  "embeddings",
  "reranking",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]
# Zero runtime dependencies. Standard library only, deliberately.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7", "mypy>=1.13"]

[project.urls]
Homepage = "https://github.com/aton-of-data/retrieval-eval"
Repository = "https://github.com/aton-of-data/retrieval-eval"
Issues = "https://github.com/aton-of-data/retrieval-eval/issues"
Changelog = "https://github.com/aton-of-data/retrieval-eval/blob/main/CHANGELOG.md"

[project.scripts]
retrieval-eval = "retrieval_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_eval"]

# The spec travels with the implementation. `scripts/sync-spec.mjs` copies the canonical
# repo-root spec/ here before a build. Without it the path does not exist and hatchling refuses
# to build at all, editable installs included, so every CI job that installs runs the sync first.
[tool.hatch.build.targets.wheel.force-include]
"spec" = "retrieval_eval/spec"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "spec", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "ANN401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src"]
