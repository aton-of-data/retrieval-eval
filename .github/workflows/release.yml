name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Never publish something that has not proved parity.
  verify:
    uses: ./.github/workflows/ci.yml

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm publish --filter retrieval-eval --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing: no long-lived token to leak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The wheel force-includes spec/, which is generated. Build without this and you publish
      # a package whose own README tells people to read a spec it does not contain.
      - run: node scripts/sync-spec.mjs

      - run: pip install build
      - run: python -m build
        working-directory: python/retrieval-eval
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/retrieval-eval/dist
