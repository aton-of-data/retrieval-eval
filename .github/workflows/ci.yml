name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python/retrieval-eval
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The wheel force-includes spec/, which is generated. hatchling refuses to build, even
      # editable, when a force-included path is missing.
      - run: node scripts/sync-spec.mjs
        working-directory: .
      - run: pip install -e ".[dev]"
      - name: py.typed is present, or the Typing::Typed classifier is a lie
        run: test -f src/retrieval_eval/py.typed
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=retrieval_eval --cov-report=term-missing --cov-fail-under=85

  # The claim this project rests on: both implementations are peers, not ports. They read the
  # same spec/fixtures and must produce the same numbers, the same rendered output, the same
  # help screens and the same exit codes. If this job fails, the spec is a lie.
  parity:
    name: Cross-language parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pip install -e ./python/retrieval-eval
      - run: python3 scripts/check_parity.py

  # Every runnable example, on a clean checkout with nothing installed. Added because the
  # first-run path broke twice in ways every other job passed straight through: `python` does
  # not exist on macOS, and the demo assumed the package was already importable. An example
  # nobody has executed as written is not an example.
  examples:
    name: Examples on a clean checkout
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No pip install, no pnpm install: the demos must fall back to the in-repo source.
      - name: python3 demo.py
        working-directory: examples/quickstart
        run: python3 demo.py

      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: node demo.mjs
        working-directory: examples/quickstart
        run: node demo.mjs

      # Both demos describe the same run, so they must print the same thing.
      - name: the two demos agree
        working-directory: examples/quickstart
        run: diff <(node demo.mjs) <(python3 demo.py)
        shell: bash

      # The demo's whole claim is a 1.00 -> 0.00 -> 1.00 swing with retrieval perfect
      # throughout. If that stops being true the demo proves nothing, so assert it.
      - name: the collapse and the recovery both still happen
        working-directory: examples/quickstart
        shell: bash
        run: |
          out=$(python3 demo.py)
          echo "$out"
          grep -q "recall@3 = 0.0000" <<<"$out" || { echo "::error::no collapse"; exit 1; }
          grep -q "a 1.00 collapse"   <<<"$out" || { echo "::error::collapse not 1.00"; exit 1; }
          grep -q "back where it started" <<<"$out" || { echo "::error::no recovery"; exit 1; }
          grep -q "0 still need a human"  <<<"$out" || { echo "::error::labels unrecoverable"; exit 1; }

      # The scenario examples, each asserted on the claim its README makes.
      - name: support-bot, an average hiding a broken query class
        shell: bash
        run: |
          out=$(examples/support-bot/run.sh)
          echo "$out"
          grep -q "legal" <<<"$out" || { echo "::error::no stratum table"; exit 1; }
          grep -q "worst stratum recall@3 is 0.0000" <<<"$out" || {
            echo "::error::the hidden failure stopped being hidden"; exit 1; }
          grep -q "re-anchored 13 label(s)" <<<"$out" || {
            echo "::error::merged labels no longer recover"; exit 1; }

      - name: reranker-vs-chunker, localizing a failure
        shell: bash
        run: |
          out=$(examples/reranker-vs-chunker/run.sh)
          echo "$out"
          grep -q "recall@5         0.3333" <<<"$out" || { echo "::error::k=5 changed"; exit 1; }
          grep -q "recall@20        1.0000" <<<"$out" || { echo "::error::k=20 changed"; exit 1; }
          grep -q "recall@5         1.0000" <<<"$out" || { echo "::error::rerank no longer fixes it"; exit 1; }

      - name: graded-relevance, the threshold is a product decision
        shell: bash
        run: |
          out=$(examples/graded-relevance/run.sh)
          echo "$out"
          grep -q "mrr@3            1.0000" <<<"$out" || {
            echo "::error::the lenient reading changed"; exit 1; }
          grep -q "mrr@3            0.5667" <<<"$out" || {
            echo "::error::the strict reading changed"; exit 1; }
          grep -q "not scored, no label at the relevance threshold" <<<"$out" || {
            echo "::error::an unscored stratum is no longer reported"; exit 1; }

      - name: judged-metrics, error bars and a third verdict
        shell: bash
        run: |
          out=$(python3 examples/judged-metrics/demo.py)
          echo "$out"
          grep -q "INDETERMINATE" <<<"$out" || {
            echo "::error::one sample no longer yields INDETERMINATE"; exit 1; }
          grep -q "95% interval   \[0.6037, 0.9963\]" <<<"$out" || {
            echo "::error::the interval changed"; exit 1; }
          diff <(node examples/judged-metrics/demo.mjs) <(python3 examples/judged-metrics/demo.py)

      - name: custom-harness, the library without the CLI
        shell: bash
        run: |
          out=$(python3 examples/custom-harness/harness.py)
          echo "$out"
          grep -q "q07  recall=0.00" <<<"$out" || {
            echo "::error::per-query detail changed"; exit 1; }
          diff <(node examples/custom-harness/harness.mjs) <(python3 examples/custom-harness/harness.py)

      - name: beir-qrels, a public collection in and back out
        shell: bash
        run: |
          out=$(examples/beir-qrels/run.sh)
          echo "$out"
          grep -q "no-chunk-ids" <<<"$out" || { echo "::error::import stopped warning"; exit 1; }
          grep -q "qa1 0 d3 2"   <<<"$out" || { echo "::error::qrels round trip changed"; exit 1; }

  # The framework integrations are not executed: running them would mean installing nine
  # frameworks and a database into a pipeline whose point is that it needs none of that. They
  # are still code, so they are still checked.
  framework-examples:
    name: Framework examples are valid code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Python examples compile and lint
        run: |
          python -m compileall -q examples/frameworks
          ruff check --isolated --select E,F,W,I,UP,B,SIM --line-length 100 examples/frameworks
      - name: JavaScript examples parse
        run: |
          for file in examples/frameworks/*.mjs; do node --check "$file"; done
      - name: Shell examples parse
        run: |
          for file in examples/*/run.sh examples/cli.sh; do bash -n "$file"; done

  # Four copies of the version and three copies of the README are drift problems. A tool about
  # drift should not ship one, so they are generated and checked rather than hand-synced.
  consistency:
    name: Versions and generated READMEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:version
      - run: pnpm check:readme

  # The published tarballs must contain what their manifests claim. `files: ["spec"]` silently
  # shipped nothing for the whole of 0.1.0's development because spec/ lives at the repo root.
  packaging:
    name: Published artifacts contain the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: npm tarball carries the spec
        working-directory: packages/retrieval-eval
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q "spec/judgments.schema.json" /tmp/pack.txt || {
            echo "::error::npm tarball is missing the spec"; exit 1; }
          grep -q "spec/fixtures/basic/judgments.jsonl" /tmp/pack.txt || {
            echo "::error::npm tarball is missing the fixtures"; exit 1; }

      - name: wheel carries the spec and py.typed
        working-directory: python/retrieval-eval
        run: |
          pip install build
          python -m build
          python - <<'EOF'
          import glob, zipfile, sys
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          missing = [
              label for label, ok in (
                  ("py.typed", any("py.typed" in n for n in names)),
                  ("spec", any("/spec/" in n for n in names)),
              ) if not ok
          ]
          if missing:
              sys.exit(f"wheel is missing: {', '.join(missing)}")
          print("wheel carries py.typed and", sum("/spec/" in n for n in names), "spec files")
          EOF

      # Every other job runs the CLI from the source tree. A user runs it from an install, through
      # a symlink in node_modules/.bin, and 0.1.0 was one command away from shipping a binary
      # that exited 0 and printed nothing there. Install both artifacts and run them as a user would.
      - name: installed CLIs run and agree
        run: |
          app=$(mktemp -d)
          (cd packages/retrieval-eval && npm pack --pack-destination "$app")
          (cd "$app" && npm init -y >/dev/null && npm install ./retrieval-eval-*.tgz)
          python -m venv "$app/venv"
          "$app/venv/bin/pip" install python/retrieval-eval/dist/*.whl
          ts=$("$app/node_modules/.bin/retrieval-eval" --version)
          py=$("$app/venv/bin/retrieval-eval" --version)
          echo "npm: $ts  pypi: $py"
          [ -n "$ts" ] || { echo "::error::installed npm CLI printed nothing"; exit 1; }
          [ "$ts" = "$py" ] || { echo "::error::installed CLIs disagree"; exit 1; }
          args=(score --judgments spec/fixtures/basic/judgments.jsonl
                --run spec/fixtures/basic/run.jsonl -k 3 --color never)
          diff <("$app/node_modules/.bin/retrieval-eval" "${args[@]}"; echo "exit $?") \
               <("$app/venv/bin/retrieval-eval" "${args[@]}"; echo "exit $?")

  schemas:
    name: Spec schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema
      - name: Schemas are valid JSON Schema
        run: check-jsonschema --check-metaschema spec/*.schema.json
      - name: Fixtures validate against the judgment schema
        run: |
          for f in spec/fixtures/*/judgments.jsonl; do
            echo "checking $f"
            python -c "
          import json, sys
          for i, line in enumerate(open('$f'), 1):
              line = line.strip()
              if not line:
                  continue
              row = json.loads(line)
              for required in ('query_id', 'doc_uri', 'relevance'):
                  assert required in row, f'$f:{i}: missing {required}'
          "
          done
