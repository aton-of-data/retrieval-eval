# Keep the golden set from rotting between releases.
#
# The corpus moves on its own: documents get edited, pages get added, someone tunes the chunker.
# This job notices, re-anchors what can be re-anchored, and opens a pull request with the diff.
# It never merges anything: re-anchoring is mechanical, but deciding a label is still correct is
# not, and a set that repairs itself unsupervised is a set nobody reviews.

name: Nightly judgment drift

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Snapshot the live corpus
        run: node scripts/dump-corpus.mjs > eval/corpus.json

      - name: Classify every label
        id: drift
        run: |
          set +e
          npx retrieval-eval drift \
            --judgments eval/judgments.jsonl --corpus eval/corpus.json \
            --json > drift.json
          echo "decayed=$?" >> "$GITHUB_OUTPUT"
          set -e
          node -e '
            const s = require("./drift.json").summary;
            console.log(`valid=${s.valid} re_anchorable=${s.re_anchorable} merged=${s.merged} split=${s.split} orphaned=${s.orphaned}`);
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Re-anchor what can be re-anchored
        if: steps.drift.outputs.decayed == '1'
        run: |
          npx retrieval-eval drift \
            --judgments eval/judgments.jsonl --corpus eval/corpus.json --fix | tee fix.log

      - name: Open a pull request with the re-anchored labels
        if: steps.drift.outputs.decayed == '1'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/judgment-drift
          title: "chore(eval): re-anchor relevance labels after corpus changes"
          body-path: fix.log
          labels: evaluation
          add-paths: eval/judgments.jsonl
          commit-message: |
            chore(eval): re-anchor relevance labels after corpus changes

            Generated by retrieval-eval drift --fix. RE_ANCHORABLE and MERGED labels were
            moved onto their new chunk ids. SPLIT and ORPHANED labels were left untouched and
            still need a human: see the job summary for the counts.
